name: Build MaxBird Admin Release APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxbird-admin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Verify Java and Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -f ./gradlew || {
            echo "::error::Gradle wrapper ./gradlew was not found."
            exit 1
          }
          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::Gradle wrapper properties were not found."
            exit 1
          }
          chmod +x ./gradlew

      - name: Validate Required Supabase Configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "::error::Repository secret SUPABASE_URL is missing."
            exit 1
          fi
          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::Repository secret SUPABASE_ANON_KEY is missing."
            exit 1
          fi

      - name: Decode and Validate Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is missing. A signed release APK requires the configured release keystore."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks"

          if [[ ! -s "$GITHUB_WORKSPACE/upload-keystore.jks" ]]; then
            echo "::error::The decoded release keystore is empty or invalid."
            exit 1
          fi

          echo "Release keystore decoded."

      - name: Prepare Supabase Build Configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            # Client-side apps must use the public anon/publishable key.
            # Do not embed a Supabase service-role/secret key in an APK.
            printf 'SUPABASE_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > .env
          echo "Supabase client configuration prepared."

      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::One or more required signing secrets are missing: KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi

          ./gradlew assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Expected Release APK was not generated at $APK."
            echo "APK files found in the output directory:"
            find app/build/outputs/apk -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MaxBird-Admin-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Temporary Environment File and Keystore
        if: always()
        shell: bash
        run: |
          rm -f .env
          rm -f upload-keystore.jks

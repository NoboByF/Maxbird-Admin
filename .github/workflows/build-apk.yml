name: Build MaxBird Admin Release APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Verify Java and Gradle Wrapper
        run: |
          java -version
          chmod +x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
            echo "Release keystore decoded successfully."
          else
            echo "WARNING: KEYSTORE_BASE64 secret is empty."
          fi
          ls -la upload-keystore.jks || true

      - name: Inject Supabase Secrets and Build Config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVICE_ROLE: ${{ secrets.SERVICE_ROLE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SERVICE_ROLE=$SERVICE_ROLE"
            echo "SUPABASE_KEY=$SERVICE_ROLE"
          } > .env
          echo "Supabase configuration prepared in .env"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Verify Release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find app/build/outputs/apk -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxBird-Admin-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Temporary Environment File and Keystore
        if: always()
        run: |
          rm -f .env
          rm -f upload-keystore.jks
